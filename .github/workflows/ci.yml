name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  verify:
    name: Lint, test and source E2E
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate build artwork
        run: npm run icons

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production renderer build
        run: npm run build:renderer

      - name: Source Electron E2E
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.sha }}
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Windows package and packaged smoke test
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer, portable executable and unpacked app
        run: npm run dist

      - name: Packaged application smoke test
        run: npm run test:e2e:packaged

      - name: Write SHA-256 checksums
        run: npm run checksums

      - name: Verify SHA-256 checksums
        run: npm run checksums -- --verify

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: showflow-windows-${{ github.sha }}
          path: |
            release/ShowFlow-*-Windows-Setup.exe
            release/ShowFlow-*-Windows-Portable.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
